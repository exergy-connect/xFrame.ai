<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xForm semantic lab — browser compile</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --fg: #102033;
      --muted: #5a6f86;
      --accent: #1f6feb;
      --surface: #fff;
      --border: rgba(31, 72, 120, 0.16);
      --code-bg: #e8eef6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #d7e6ff 0%, transparent 55%),
        linear-gradient(180deg, #eef3f9, var(--bg));
      color: var(--fg);
      padding: 1.5rem;
    }
    #build-stamp {
      position: fixed;
      top: 0.85rem;
      right: 1rem;
      z-index: 10;
      margin: 0;
      font-size: 0.78rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
      pointer-events: none;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.85rem;
      margin: 0 0 0.35rem;
    }
    .lede {
      color: var(--muted);
      margin: 0 0 1.25rem;
      max-width: 42rem;
      line-height: 1.45;
    }
    .fields {
      display: grid;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .field {
      display: grid;
      gap: 0.3rem;
    }
    .field label {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
    }
    .field input,
    .field select {
      font: inherit;
      color: var(--fg);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      width: 100%;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    #status {
      color: var(--muted);
      font-size: 0.95rem;
    }
    #status[data-state="error"] { color: #b42318; }
    #status[data-state="ok"] { color: #067647; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0 0 0.65rem;
    }
    .tabs button {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      font-weight: 500;
      padding: 0.35rem 0.7rem;
    }
    .tabs button[aria-selected="true"] {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }
    pre {
      margin: 0;
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      max-height: min(70vh, 640px);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.4;
      white-space: pre;
    }
  </style>
</head>
<body>
  <p id="build-stamp" aria-live="polite">build …</p>
  <main>
    <h1>xForm semantic lab</h1>
    <p class="lede">
      Compiles a framework and topology as URLs in this page via the browser
      xForm bundle, then emits Containerlab + FRR configs
      (<code>execute: false</code>).
    </p>
    <div class="fields">
      <div class="field">
        <label for="framework">Framework</label>
        <select id="framework">
          <option value="semantic-lab-fw.xpt" selected>semantic-lab-fw.xpt (local)</option>
        </select>
      </div>
      <div class="field">
        <label for="topology">Topology URL</label>
        <input
          id="topology"
          type="text"
          spellcheck="false"
          autocomplete="off"
          value="topology.xp"
        >
      </div>
    </div>
    <div class="toolbar">
      <button type="button" id="run">Compile</button>
      <span id="status" role="status">Ready</span>
    </div>
    <div class="tabs" id="tabs" hidden></div>
    <pre id="output" hidden></pre>
  </main>
  <script type="module">
    import {
      compileFiles,
      emitFinal,
      isFinalFilesBundle,
      prefetchHttpTexts,
    } from "../../web/xform/xform.browser.min.js";

    const BUNDLE_URL = new URL("../../web/xform/xform.browser.min.js", import.meta.url);
    const pageBase = new URL("./", location.href);
    const runBtn = document.getElementById("run");
    const status = document.getElementById("status");
    const tabs = document.getElementById("tabs");
    const output = document.getElementById("output");
    const frameworkSelect = document.getElementById("framework");
    const topologyInput = document.getElementById("topology");
    const buildStamp = document.getElementById("build-stamp");

    async function showBundleBuildStamp() {
      try {
        const response = await fetch(BUNDLE_URL.href, { cache: "no-cache" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const head = (await response.text()).slice(0, 240);
        const match = head.match(
          /xform browser bundle build:\s*([^\s]+)\s+sha=([^\s\n]+)/,
        );
        if (!match) {
          buildStamp.textContent = "build unknown";
          return;
        }
        const stamp = match[1].replace("T", " ");
        const sha = match[2];
        buildStamp.textContent =
          sha === "local-dev" ? `build ${stamp}` : `build ${stamp} · ${sha.slice(0, 7)}`;
        buildStamp.title = `xform.browser.min.js ${match[1]} sha=${sha}`;
      } catch {
        buildStamp.textContent = "build unknown";
      }
    }

    void showBundleBuildStamp();

    /** @type {Record<string, string>} */
    let files = {};

    /** Resolve a page-relative or absolute URL against this example directory. */
    function resolveUrl(value, label) {
      const trimmed = String(value ?? "").trim();
      if (!trimmed) {
        throw new Error(`${label} URL is required`);
      }
      return new URL(trimmed, pageBase).href;
    }

    function setStatus(text, state = "") {
      status.textContent = text;
      if (state) status.dataset.state = state;
      else delete status.dataset.state;
    }

    function showFiles(next) {
      files = next;
      const names = Object.keys(files);
      tabs.hidden = names.length === 0;
      output.hidden = names.length === 0;
      tabs.replaceChildren();
      for (const name of names) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = name;
        btn.addEventListener("click", () => selectFile(name));
        tabs.append(btn);
      }
      if (names[0]) selectFile(names[0]);
    }

    function selectFile(name) {
      for (const btn of tabs.querySelectorAll("button")) {
        btn.setAttribute("aria-selected", String(btn.textContent === name));
      }
      output.textContent = files[name] ?? "";
    }

    async function compile() {
      runBtn.disabled = true;
      setStatus("Compiling…");
      try {
        const fwUrl = resolveUrl(frameworkSelect.value, "Framework");
        const topoUrl = resolveUrl(topologyInput.value, "Topology");
        const fwBase = new URL("./", fwUrl);
        const templateUrls = [
          new URL("templates/_final/clab.yml.xpt", fwBase).href,
          new URL("templates/devices/frr.xpt", fwBase).href,
          new URL("templates/modules/bgp.xpt", fwBase).href,
        ];
        const filterUrls = [
          new URL("filters/normalize_links.js", fwBase).href,
          new URL("filters/assign_ips.js", fwBase).href,
          new URL("filters/ip.js", fwBase).href,
        ];

        await prefetchHttpTexts([
          fwUrl,
          topoUrl,
          ...templateUrls,
          ...filterUrls,
        ]);

        const tree = await compileFiles([fwUrl, topoUrl], {
          execute: false,
        });
        const result = await emitFinal(tree, "clab.yml", {
          baseDir: fwBase.href,
        });

        /** @type {Record<string, string>} */
        const next = {};
        if (isFinalFilesBundle(result)) {
          for (const file of result.files) {
            next[file.path] = file.content;
          }
        } else {
          next["clab.yml"] = String(result);
        }
        showFiles(next);
        setStatus(`Done — ${Object.keys(next).length} file(s)`, "ok");
      } catch (error) {
        console.error(error);
        showFiles({});
        setStatus(
          error instanceof Error ? error.message : String(error),
          "error",
        );
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener("click", () => {
      void compile();
    });
    void compile();
  </script>
</body>
</html>
