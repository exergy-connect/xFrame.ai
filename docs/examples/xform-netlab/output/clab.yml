name: ebgp-session
prefix: ""

mgmt:
  network: netlab_mgmt
  ipv4-subnet: 192.168.121.0/24

topology:
  nodes:
    dut:
      kind: linux
      image: quay.io/frrouting/frr:10.6.1
      runtime: docker
      mgmt-ipv4: 192.168.121.101
      binds:
        - config/dut.conf:/etc/frr/frr.conf
    x1:
      kind: linux
      image: quay.io/frrouting/frr:10.6.1
      runtime: docker
      mgmt-ipv4: 192.168.121.102
      binds:
        - config/x1.conf:/etc/frr/frr.conf
    x2:
      kind: linux
      image: quay.io/frrouting/frr:10.6.1
      runtime: docker
      mgmt-ipv4: 192.168.121.103
      binds:
        - config/x2.conf:/etc/frr/frr.conf

  links:
  - endpoints:
      - "dut:eth1"
      - "x1:eth1"
  - endpoints:
      - "dut:eth2"
      - "x2:eth1"
