<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xForm netlab — browser compile</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --fg: #102033;
      --muted: #5a6f86;
      --accent: #1f6feb;
      --surface: #fff;
      --border: rgba(31, 72, 120, 0.16);
      --code-bg: #e8eef6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #d7e6ff 0%, transparent 55%),
        linear-gradient(180deg, #eef3f9, var(--bg));
      color: var(--fg);
      padding: 1.5rem;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-family: "IBM Plex Serif", Georgia, serif;
      font-weight: 600;
      font-size: 1.85rem;
      margin: 0 0 0.35rem;
    }
    .lede {
      color: var(--muted);
      margin: 0 0 1.25rem;
      max-width: 42rem;
      line-height: 1.45;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    button {
      appearance: none;
      border: 0;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    #status {
      color: var(--muted);
      font-size: 0.95rem;
    }
    #status[data-state="error"] { color: #b42318; }
    #status[data-state="ok"] { color: #067647; }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0 0 0.65rem;
    }
    .tabs button {
      background: transparent;
      color: var(--fg);
      border: 1px solid var(--border);
      font-weight: 500;
      padding: 0.35rem 0.7rem;
    }
    .tabs button[aria-selected="true"] {
      background: var(--surface);
      border-color: var(--accent);
      color: var(--accent);
    }
    pre {
      margin: 0;
      padding: 1rem 1.1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      max-height: min(70vh, 640px);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      font-size: 0.82rem;
      line-height: 1.4;
      white-space: pre;
    }
  </style>
</head>
<body>
  <main>
    <h1>xForm netlab</h1>
    <p class="lede">
      Loads <code>netlab-fw.xpt</code> and <code>topology.xp</code> as URLs in this
      page, runs the browser xForm bundle, and emits Containerlab + FRR configs
      (<code>execute: false</code>).
    </p>
    <div class="toolbar">
      <button type="button" id="run">Compile</button>
      <span id="status" role="status">Ready</span>
    </div>
    <div class="tabs" id="tabs" hidden></div>
    <pre id="output" hidden></pre>
  </main>
  <script type="module">
    import {
      compileFiles,
      emitFinal,
      isFinalFilesBundle,
      prefetchHttpTexts,
    } from "../../web/xform/xform.browser.min.js";

    const runBtn = document.getElementById("run");
    const status = document.getElementById("status");
    const tabs = document.getElementById("tabs");
    const output = document.getElementById("output");

    /** @type {Record<string, string>} */
    let files = {};

    function setStatus(text, state = "") {
      status.textContent = text;
      if (state) status.dataset.state = state;
      else delete status.dataset.state;
    }

    function showFiles(next) {
      files = next;
      const names = Object.keys(files);
      tabs.hidden = names.length === 0;
      output.hidden = names.length === 0;
      tabs.replaceChildren();
      for (const name of names) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = name;
        btn.addEventListener("click", () => selectFile(name));
        tabs.append(btn);
      }
      if (names[0]) selectFile(names[0]);
    }

    function selectFile(name) {
      for (const btn of tabs.querySelectorAll("button")) {
        btn.setAttribute("aria-selected", String(btn.textContent === name));
      }
      output.textContent = files[name] ?? "";
    }

    async function compile() {
      runBtn.disabled = true;
      setStatus("Compiling…");
      try {
        const base = new URL("./", location.href);
        const fwUrl = new URL("netlab-fw.xpt", base).href;
        const topoUrl = new URL("topology.xp", base).href;
        const templateUrls = [
          new URL("templates/_final/clab.yml.xpt", base).href,
          new URL("templates/devices/frr.xpt", base).href,
          new URL("templates/modules/bgp.xpt", base).href,
        ];
        const filterUrls = [
          new URL("filters/normalize_links.js", base).href,
          new URL("filters/assign_ips.js", base).href,
          new URL("filters/ip.js", base).href,
        ];

        await prefetchHttpTexts([
          fwUrl,
          topoUrl,
          ...templateUrls,
          ...filterUrls,
        ]);

        const tree = await compileFiles([fwUrl, topoUrl], {
          execute: false,
        });
        const result = await emitFinal(tree, "clab.yml", {
          baseDir: base.href,
        });

        /** @type {Record<string, string>} */
        const next = {};
        if (isFinalFilesBundle(result)) {
          for (const file of result.files) {
            next[file.path] = file.content;
          }
        } else {
          next["clab.yml"] = String(result);
        }
        showFiles(next);
        setStatus(`Done — ${Object.keys(next).length} file(s)`, "ok");
      } catch (error) {
        console.error(error);
        showFiles({});
        setStatus(
          error instanceof Error ? error.message : String(error),
          "error",
        );
      } finally {
        runBtn.disabled = false;
      }
    }

    runBtn.addEventListener("click", () => {
      void compile();
    });
    void compile();
  </script>
</body>
</html>
