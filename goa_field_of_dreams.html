  <style>
    * { box-sizing: border-box; }
    html, body {

      margin: 0;
      overflow: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    header {
      flex-shrink: 0;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #30363d;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
    }
    h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
    .sub { font-size: 0.8rem; color: #8b949e; margin: 0; flex: 1 1 280px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; }
    button {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #238636; }
    button.primary:hover { background: #2ea043; }
    #map {
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .time-readout {
      font-variant-numeric: tabular-nums;
      min-width: 9rem;
      font-size: 0.9rem;
      color: #58a6ff;
    }
    .scrub-block {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1 1 220px;
      min-width: min(420px, 55vw);
    }
    .scrub-block > label { font-size: 0.8rem; color: #8b949e; }
    .scrub-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .scrub-year {
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
      color: #8b949e;
      flex-shrink: 0;
      width: 2.75rem;
    }
    .scrub-year-start { text-align: right; }
    .scrub-year-end { text-align: left; }
    .scrub-wrap input[type="range"] {
      flex: 1;
      min-width: 80px;
      vertical-align: middle;
    }
    .legend {
      background: rgba(22, 27, 34, 0.92);
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-size: 11px;
      line-height: 1.45;
      max-width: 220px;
    }
    .legend b { color: #fff; }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: middle; border: 1px solid #484f58; flex-shrink: 0; }
    .legend-plays-title { margin-top: 8px; font-size: 11px; font-weight: 600; color: #fff; }
    .legend-play-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; line-height: 1.35; color: #e6edf3; }
    .leaflet-tooltip.discovery-flash-wrap {
      background: rgba(22, 27, 34, 0.96) !important;
      border: 1px solid #58a6ff !important;
      border-radius: 6px !important;
      color: #e6edf3 !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45) !important;
      padding: 7px 11px !important;
      font-size: 12px !important;
      line-height: 1.35 !important;
      max-width: 260px;
    }
    .discovery-flash-title { font-weight: 700; margin-bottom: 3px; }
    .discovery-flash-op { color: #8b949e; font-size: 11px; }
    #yt-bg-music {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: min(288px, 42vw);
      z-index: 10050;
      background: rgba(22, 27, 34, 0.97);
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }
    #yt-bg-music .yt-bg-music-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 6px 8px;
      border-bottom: 1px solid #30363d;
    }
    #yt-bg-music .yt-bg-hint {
      font-size: 10px;
      color: #8b949e;
      line-height: 1.3;
      flex: 1;
      min-width: 100px;
    }
    #yt-bg-music .yt-sound-btn {
      background: #21262d;
      color: #e6edf3;
      border: 1px solid #58a6ff;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    #yt-bg-music .yt-sound-btn:hover { background: #30363d; }
    #yt-bg-music iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      border: 0;
    }
    .copyright {
      position: fixed;
      left: 12px;
      bottom: 8px;
      z-index: 10040;
      margin: 0;
      font-size: 11px;
      color: #8b949e;
      font-style: italic;
      pointer-events: none;
    }
  </style>

  <script>
(function () {
  const cfg = JSON.parse(document.getElementById('map-config').textContent);
  const GREY = '#9e9e9e';
  const features = cfg.features;
  const legendPlays = cfg.legendPlays || [];
  const tMin = cfg.tMin;
  const tMax = cfg.tMax;
  const tMinMs = Date.parse(tMin + 'T12:00:00');
  const tMaxMs = Date.parse(tMax + 'T12:00:00');
  const span = Math.max(1, tMaxMs - tMinMs);
  document.getElementById('scrub-year-start').textContent = tMin.slice(0, 4);
  document.getElementById('scrub-year-end').textContent = tMax.slice(0, 4);

  function parseDay(s) {
    if (!s) return null;
    const t = Date.parse(s.slice(0, 10) + 'T12:00:00');
    return Number.isNaN(t) ? null : t;
  }

  (function tileReferrerPolicy() {
    var policy = 'strict-origin-when-cross-origin';
    var origCreate = L.TileLayer.prototype.createTile;
    L.TileLayer.prototype.createTile = function (coords, done) {
      var tile = origCreate.call(this, coords, done);
      if (tile && tile.tagName === 'IMG') tile.referrerPolicy = policy;
      return tile;
    };
  })();

  const map = L.map('map', { preferCanvas: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  const layers = [];
  const bounds = [];
  features.forEach(function (f) {
    const p = f.properties;
    const c = f.geometry.coordinates;
    const latlng = [c[1], c[0]];
    bounds.push(latlng);
    const disc = parseDay(p.effectiveDiscovery);
    const prod = parseDay(p.dateProductionStart);
    const r = 4 + p.radiusNorm * 14;
    const halos = [];
    [14000, 9500, 6000].forEach(function (meters, i) {
      const circle = L.circle(latlng, {
        radius: meters * p.radiusNorm,
        stroke: false,
        fillColor: GREY,
        fillOpacity: 0.12 + i * 0.12,
        interactive: false
      });
      halos.push(circle);
    });
    const dot = L.circleMarker(latlng, {
      radius: r,
      stroke: true,
      color: '#111',
      weight: 1.5,
      fillColor: GREY,
      fillOpacity: 0.95
    });
    let flag = null;
    if (p.isGasOnly) {
      flag = L.circleMarker([latlng[0] + 0.02, latlng[1]], {
        radius: Math.max(r * 0.55, 5),
        stroke: true,
        color: '#fff',
        weight: 1.2,
        fillColor: '#c62828',
        fillOpacity: 1
      });
    }
    const tip = [
      '<b>', String(p.label || '').replace(/</g, '&lt;'), '</b><br/>',
      (p.fieldName || '').replace(/</g, '&lt;'), '<br/>',
      'Play: ', (p.playName || '—'), '<br/>',
      'Discovery: ', (p.dateDiscovery || '—'), '<br/>',
      'Onstream: ', (p.dateProductionStart || '—'), '<br/>',
      'Reserves (mmboe): ', (p.reserveMmboe != null ? p.reserveMmboe.toFixed(1) : '—')
    ].join('');
    dot.bindPopup(tip);
    halos.forEach(function (h) { h.addTo(map); });
    dot.addTo(map);
    if (flag) flag.addTo(map);
    layers.push({
      halos: halos,
      dot: dot,
      flag: flag,
      disc: disc,
      prod: prod,
      color: p.onstreamColor,
      fieldName: p.fieldName || '',
      originalOperator: p.originalOperator || '',
      discoveryAnnounced: false,
      _discoveryFlashTimer: null
    });
  });

  if (bounds.length) {
    map.fitBounds(L.latLngBounds(bounds), { padding: [28, 28] });
  }

  function styleForTime(nowMs) {
    layers.forEach(function (row) {
      const visible = row.disc != null && nowMs >= row.disc;
      const onstream = row.prod != null && nowMs >= row.prod;
      const fill = visible ? (onstream ? row.color : GREY) : GREY;
      const opacity = visible ? 0.95 : 0;
      row.dot.setStyle({ fillColor: fill, fillOpacity: opacity });
      row.halos.forEach(function (h, i) {
        if (!visible) {
          h.setStyle({ fillOpacity: 0 });
          return;
        }
        const base = onstream ? row.color : GREY;
        h.setStyle({ fillColor: base, fillOpacity: onstream ? (0.14 + i * 0.14) : (0.08 + i * 0.06) });
      });
      if (row.flag) {
        row.flag.setStyle({ fillOpacity: visible ? 1 : 0, stroke: visible });
      }
    });
  }

  const readout = document.getElementById('time-readout');
  const btnPlay = document.getElementById('btn-play');
  const btnPause = document.getElementById('btn-pause');
  const scrub = document.getElementById('scrub');
  const SCRUB_STEPS = 1000;
  scrub.min = '0';
  scrub.max = String(SCRUB_STEPS);
  scrub.step = '1';
  let scrubProgrammatic = false;
  let currentMs = tMinMs;
  let playing = false;
  let raf = null;
  let lastPerf = 0;
  const BASE_WALL_SEC_FULL_PLAY = 7 * 60;
  let speedMultiplier = 1;
  function speedSimMsPerWallMs() {
    return (span / (BASE_WALL_SEC_FULL_PLAY * 1000)) * speedMultiplier;
  }
  const DISCOVERY_FLASH_MS = 3800;
  let bgMusicStarted = false;
  var bgMusicIframe = null;
  function ytEmbedSrc() {
    /* nocookie + no embed origin param: avoids YouTube Error 153 when Referer/origin mismatch */
    return 'https://www.youtube-nocookie.com/embed/rdB13lFexNk?list=RDrdB13lFexNk&autoplay=1&mute=1&playsinline=1&enablejsapi=1&controls=1';
  }
  function ytPostCommand(func, args) {
    if (!bgMusicIframe || !bgMusicIframe.contentWindow) return;
    try {
      bgMusicIframe.contentWindow.postMessage(JSON.stringify({
        event: 'command',
        func: func,
        args: args !== undefined ? args : []
      }), '*');
    } catch (e) { /* ignore */ }
  }
  function ensureBackgroundMusic() {
    if (bgMusicStarted) return;
    bgMusicStarted = true;
    var wrap = document.createElement('div');
    wrap.id = 'yt-bg-music';
    wrap.setAttribute('role', 'region');
    wrap.setAttribute('aria-label', 'Background music');
    var bar = document.createElement('div');
    bar.className = 'yt-bg-music-bar';
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'yt-sound-btn';
    btn.textContent = 'Sound on';
    btn.addEventListener('click', function () {
      function fire() {
        ytPostCommand('unMute', []);
        ytPostCommand('setVolume', [100]);
        ytPostCommand('playVideo', []);
      }
      fire();
      setTimeout(fire, 300);
    });
    var hint = document.createElement('span');
    hint.className = 'yt-bg-hint';
    hint.textContent = 'Starts muted (browser policy). Click Sound on or unmute in the player.';
    bar.appendChild(btn);
    bar.appendChild(hint);
    var ifr = document.createElement('iframe');
    ifr.src = ytEmbedSrc();
    ifr.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen');
    ifr.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    ifr.setAttribute('loading', 'eager');
    ifr.title = 'YouTube background playlist';
    bgMusicIframe = ifr;
    wrap.appendChild(bar);
    wrap.appendChild(ifr);
    document.body.appendChild(wrap);
  }

  function fmt(ms) {
    const d = new Date(ms);
    return d.toISOString().slice(0, 10);
  }

  function escHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function clearDiscoveryFlashState() {
    layers.forEach(function (row) {
      row.discoveryAnnounced = false;
      if (row._discoveryFlashTimer) {
        clearTimeout(row._discoveryFlashTimer);
        row._discoveryFlashTimer = null;
      }
      row.dot.closeTooltip();
      row.dot.unbindTooltip();
    });
  }

  function showDiscoveryFlash(row) {
    var op = row.originalOperator ? row.originalOperator : '—';
    var html = '<div class="discovery-flash"><div class="discovery-flash-title">' + escHtml(row.fieldName) +
      '</div><div class="discovery-flash-op">' + escHtml(op) + '</div></div>';
    row.dot.unbindTooltip();
    row.dot.bindTooltip(html, {
      permanent: true,
      direction: 'top',
      offset: [0, -8],
      className: 'discovery-flash-wrap',
      opacity: 1,
      interactive: false
    });
    row.dot.openTooltip();
    if (row._discoveryFlashTimer) clearTimeout(row._discoveryFlashTimer);
    row._discoveryFlashTimer = setTimeout(function () {
      row.dot.closeTooltip();
      row.dot.unbindTooltip();
      row._discoveryFlashTimer = null;
    }, DISCOVERY_FLASH_MS);
  }

  function maybeAnnounceDiscoveries(oldMs, newMs) {
    layers.forEach(function (row) {
      if (row.disc == null) return;
      if (newMs < row.disc) {
        row.discoveryAnnounced = false;
        return;
      }
      if (oldMs < row.disc && newMs >= row.disc && !row.discoveryAnnounced) {
        row.discoveryAnnounced = true;
        showDiscoveryFlash(row);
      }
    });
  }

  function syncScrubFromTime() {
    const frac = span <= 0 ? 0 : (currentMs - tMinMs) / span;
    const v = String(Math.round(Math.min(SCRUB_STEPS, Math.max(0, frac * SCRUB_STEPS))));
    scrubProgrammatic = true;
    scrub.value = v;
    scrubProgrammatic = false;
  }

  function paint() {
    readout.textContent = fmt(currentMs);
    syncScrubFromTime();
    styleForTime(currentMs);
  }

  scrub.addEventListener('input', function () {
    if (scrubProgrammatic) return;
    const x = parseFloat(scrub.value);
    if (Number.isNaN(x)) return;
    const frac = Math.min(1, Math.max(0, x / SCRUB_STEPS));
    const oldMs = currentMs;
    currentMs = tMinMs + frac * span;
    maybeAnnounceDiscoveries(oldMs, currentMs);
    paint();
  });

  function tick(ts) {
    if (!playing) return;
    if (!lastPerf) lastPerf = ts;
    const dt = ts - lastPerf;
    lastPerf = ts;
    const oldMs = currentMs;
    currentMs += dt * speedSimMsPerWallMs();
    if (currentMs > tMaxMs) {
      currentMs = tMaxMs;
      playing = false;
      btnPause.textContent = 'Pause';
    }
    maybeAnnounceDiscoveries(oldMs, currentMs);
    paint();
    if (playing) raf = requestAnimationFrame(tick);
  }

  document.getElementById('btn-play').addEventListener('click', function () {
    if (playing) {
      speedMultiplier *= 2;
      return;
    }
    ensureBackgroundMusic();
    playing = true;
    btnPlay.textContent = 'Speedup';
    btnPause.textContent = 'Pause';
    lastPerf = 0;
    if (currentMs >= tMaxMs) {
      clearDiscoveryFlashState();
      maybeAnnounceDiscoveries(tMinMs - 1, tMinMs);
      currentMs = tMinMs;
      speedMultiplier = 1;
    }
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  });
  btnPause.addEventListener('click', function () {
    if (playing) {
      playing = false;
      if (raf) cancelAnimationFrame(raf);
      btnPause.textContent = 'Resume';
      return;
    }
    if (btnPause.textContent !== 'Resume') return;
    ensureBackgroundMusic();
    playing = true;
    btnPause.textContent = 'Pause';
    lastPerf = 0;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  });
  document.getElementById('btn-reset').addEventListener('click', function () {
    playing = false;
    if (raf) cancelAnimationFrame(raf);
    clearDiscoveryFlashState();
    maybeAnnounceDiscoveries(tMinMs - 1, tMinMs);
    currentMs = tMinMs;
    speedMultiplier = 1;
    btnPlay.textContent = 'Play';
    btnPause.textContent = 'Pause';
    paint();
  });

  const LegendCtrl = L.Control.extend({
    options: { position: 'topright' },
    onAdd: function () {
      const d = L.DomUtil.create('div', 'legend leaflet-control');
      const title = L.DomUtil.create('b', '', d);
      title.textContent = 'Legend';
      d.appendChild(document.createElement('br'));
      const line1 = L.DomUtil.create('div', '', d);
      line1.innerHTML = '<span class="swatch" style="background:' + GREY + '"></span> Discovered, not onstream';
      const line2 = L.DomUtil.create('div', '', d);
      line2.style.marginTop = '4px';
      line2.innerHTML = '<span class="swatch" style="background:linear-gradient(90deg,#c0392b,#e67e22,#f1c40f,#27ae60,#3498db,#8e44ad)"></span> Onstream (play color)';
      const line3 = L.DomUtil.create('small', '', d);
      line3.style.display = 'block';
      line3.style.marginTop = '4px';
      line3.textContent = 'Halo size ∝ reserves';
      if (legendPlays.length) {
        const pt = L.DomUtil.create('div', 'legend-plays-title', d);
        pt.textContent = 'Play (oldest → youngest)';
        legendPlays.forEach(function (entry) {
          const row = L.DomUtil.create('div', 'legend-play-row', d);
          const sw = L.DomUtil.create('span', 'swatch', row);
          sw.style.background = entry.color;
          sw.style.borderColor = '#30363d';
          const lab = L.DomUtil.create('span', '', row);
          lab.textContent = entry.name;
        });
      }
      return d;
    }
  });
  map.addControl(new LegendCtrl());

  paint();
})();
  </script>
</body>
</html>
