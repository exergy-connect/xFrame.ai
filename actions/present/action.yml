name: xFrame Present
description: Compile an xFrame .xp or Markdown presentation to IR, HTML, PNG, or PowerPoint
inputs:
  source:
    description: Path to the .xp or Markdown source, relative to the consuming repository
    required: true
  formats:
    description: Comma-separated outputs (ir, html, png, pptx)
    required: false
    default: ir,html
  output_dir:
    description: Output directory; defaults to the source directory
    required: false
  snapshot_width:
    description: PNG snapshot viewport width in pixels
    required: false
    default: "1440"
  snapshot_height:
    description: PNG snapshot viewport height in pixels
    required: false
    default: "900"
  evaluation:
    description: Override evaluation mode (static or dynamic)
    required: false
  presentation:
    description: Active presentation template name (must be listed in document presentations when set)
    required: false
  theme:
    description: Override themes (comma-separated)
    required: false
  style:
    description: Override document styles (comma-separated; layout styles still apply)
    required: false
  templates:
    description: Optional custom templates directory
    required: false
  embed_images:
    description: Embed local Media images as data URIs in HTML
    required: false
    default: "false"
  llm:
    description: Enable compile-time llm() evaluation
    required: false
    default: "false"
  llm_model:
    description: Optional compile-time LLM model override
    required: false
outputs:
  ir:
    description: Absolute path to the generated IR, when requested
  html:
    description: Absolute path to the generated HTML, when requested
  png:
    description: Absolute path to the generated HTML snapshot, when requested
  pptx:
    description: Absolute path to the generated PowerPoint, when requested
runs:
  using: node24
  main: dist-action.cjs
branding:
  icon: monitor
  color: blue
