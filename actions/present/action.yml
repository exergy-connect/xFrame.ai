name: 'xFrame present'
description: >-
  Compile a Markdown presentation deck into a single self-contained HTML file.
  Optional consolidated xFrame JSON data for provenance footers and inline graphs.
  Requires Node.js 18+ on the runner.

inputs:
  input:
    description: Path to the Markdown deck file (relative to the workflow workspace unless absolute).
    required: true
  output:
    description: >-
      Output HTML path. If omitted, the input path with its extension replaced by `.html` is used.
    required: false
    default: ''
  title:
    description: Deck title (overrides front matter).
    required: false
    default: ''
  author:
    description: Author metadata (overrides front matter).
    required: false
    default: ''
  theme:
    description: 'Visual theme: `light` or `dark` (overrides front matter).'
    required: false
    default: ''
  data:
    description: >-
      URL or path to consolidated xFrame JSON data (overrides front matter). Local paths
      resolve relative to the deck file's directory unless absolute.
    required: false
    default: ''
  no-embed-images:
    description: 'Set to `true` to pass `--no-embed-images` (keep original image URLs).'
    required: false
    default: 'false'
  skip-locales:
    description: 'Set to `true` to pass `--skip-locales` (do not compile locale siblings).'
    required: false
    default: 'false'
  generate-locales:
    description: >-
      Comma-separated locale codes to generate (`de,es,ja`), or `*` to regenerate all
      existing locale siblings. Missing files are always created; existing files are
      skipped unless overwrite is true or `*` is used.
    required: false
    default: ''
  overwrite:
    description: 'Set to `true` to pass `--overwrite` (force-regenerate listed locales that already exist).'
    required: false
    default: 'false'
  openrouter-api-token:
    description: OpenRouter API key (required when generate-locales is non-empty).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run present.min.js
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INPUT: ${{ inputs.input }}
        OUTPUT: ${{ inputs.output }}
        TITLE: ${{ inputs.title }}
        AUTHOR: ${{ inputs.author }}
        THEME: ${{ inputs.theme }}
        DATA: ${{ inputs.data }}
        NO_EMBED: ${{ inputs.no-embed-images }}
        SKIP_LOCALES: ${{ inputs.skip-locales }}
        GENERATE_LOCALES: ${{ inputs.generate-locales }}
        OVERWRITE: ${{ inputs.overwrite }}
        OPENROUTER_TOKEN: ${{ inputs.openrouter-api-token }}
      run: |
        set -euo pipefail
        script="${ACTION_PATH}/../../skills/xframe-present/scripts/present.min.js"
        if [[ ! -f "$script" ]]; then
          echo "::error file=${script}::Present script missing (expected bundled xframe-present asset)."
          exit 1
        fi
        if [[ -n "${GENERATE_LOCALES}" && -z "${OPENROUTER_TOKEN}" ]]; then
          echo "::error::openrouter-api-token is required when generate-locales is set"
          exit 1
        fi
        cmd=(node "$script" "$INPUT")
        [[ -n "${OUTPUT}" ]] && cmd+=(--output "$OUTPUT")
        [[ -n "${TITLE}" ]] && cmd+=(--title "$TITLE")
        [[ -n "${AUTHOR}" ]] && cmd+=(--author "$AUTHOR")
        [[ -n "${THEME}" ]] && cmd+=(--theme "$THEME")
        [[ -n "${DATA}" ]] && cmd+=(--data "$DATA")
        [[ "${NO_EMBED}" == "true" ]] && cmd+=(--no-embed-images)
        [[ "${SKIP_LOCALES}" == "true" ]] && cmd+=(--skip-locales)
        [[ -n "${GENERATE_LOCALES}" ]] && cmd+=(--generate-locales "${GENERATE_LOCALES}")
        [[ "${OVERWRITE}" == "true" ]] && cmd+=(--overwrite)
        [[ -n "${OPENROUTER_TOKEN}" ]] && export OPENROUTER_API_KEY="${OPENROUTER_TOKEN}"
        "${cmd[@]}"
