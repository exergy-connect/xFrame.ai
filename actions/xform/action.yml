name: 'xForm'
description: >-
  Compile composable .xp semantic documents into deterministic materializations.
  Produces either an intermediate compile-tree representation (JSON) or finalized
  artifacts. Requires Node.js 24+ on the runner.

inputs:
  sources:
    description: >-
      Space-separated semantic sources (*.xp, *.json, *.js, directories, or
      directory patterns) used to construct the xForm document model.
    required: true
  output:
    description: >-
      Output path for the compile-tree JSON (`-o`). If omitted, defaults to
      output/<document>.json beside the primary .xp source.
    required: false
    default: ''
  materialization:
    description: >-
      Materialization target extension (e.g. `html`). Passed as
      `--final <extension>`.
    required: false
    default: ''
  tree:
    description: 'Set to `true` to pass `--tree` (write full compile-tree JSON).'
    required: false
    default: 'false'
  keep-segment-separators:
    description: 'Set to `true` to pass `--keep-segment-separators`.'
    required: false
    default: 'false'
  no-recurse:
    description: 'Set to `true` to pass `--no-recurse`.'
    required: false
    default: 'false'
  skip-symlinks:
    description: 'Set to `true` to pass `--skip-symlinks`.'
    required: false
    default: 'false'
  no-execute:
    description: >-
      Set to `true` to pass `--no-execute` (emit the `_execution` plan only;
      do not realize / run capability commands).
    required: false
    default: 'false'
  auto-approve:
    description: >-
      Set to `true` to pass `--auto-approve` (run capability commands without
      interactive approval; required for non-interactive CI capability runs).
    required: false
    default: 'false'
  working-directory:
    description: >-
      Directory to run xform from (relative to the workspace, or absolute).
      Defaults to the job workspace root. Use when sources and relative
      capability paths (e.g. `output/`) are rooted in a subdirectory.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Run xform.min.js
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCES: ${{ inputs.sources }}
        OUTPUT: ${{ inputs.output }}
        FINAL: ${{ inputs.materialization }}
        TREE: ${{ inputs.tree }}
        KEEP_SEPS: ${{ inputs.keep-segment-separators }}
        NO_RECURSE: ${{ inputs.no-recurse }}
        SKIP_SYMLINKS: ${{ inputs.skip-symlinks }}
        NO_EXECUTE: ${{ inputs.no-execute }}
        AUTO_APPROVE: ${{ inputs.auto-approve }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        script="${ACTION_PATH}/../../skills/xform/scripts/xform.min.js"
        if [[ ! -f "$script" ]]; then
          echo "::error file=${script}::xForm script missing (expected bundled xform skill asset)."
          exit 1
        fi
        if [[ -n "${WORKING_DIRECTORY}" ]]; then
          cd "${WORKING_DIRECTORY}"
          echo "xform: cwd $(pwd)"
        fi
        # shellcheck disable=SC2206
        sources=( ${SOURCES} )
        if [[ ${#sources[@]} -eq 0 ]]; then
          echo "::error::sources input is empty"
          exit 1
        fi
        cmd=(node "$script" "${sources[@]}")
        [[ -n "${OUTPUT}" ]] && cmd+=(-o "$OUTPUT")
        [[ -n "${FINAL}" ]] && cmd+=(--final "$FINAL")
        [[ "${TREE}" == "true" ]] && cmd+=(--tree)
        [[ "${KEEP_SEPS}" == "true" ]] && cmd+=(--keep-segment-separators)
        [[ "${NO_RECURSE}" == "true" ]] && cmd+=(--no-recurse)
        [[ "${SKIP_SYMLINKS}" == "true" ]] && cmd+=(--skip-symlinks)
        [[ "${NO_EXECUTE}" == "true" ]] && cmd+=(--no-execute)
        [[ "${AUTO_APPROVE}" == "true" ]] && cmd+=(--auto-approve)
        echo "xform: ${cmd[*]}"
        "${cmd[@]}"
        # Summarize artifacts written beside the primary .xp/.xpt source.
        primary=""
        for s in "${sources[@]}"; do
          case "$s" in
            *.xp|*.xpt) primary="$s" ;;
          esac
        done
        if [[ -n "${OUTPUT}" && -f "${OUTPUT}" ]]; then
          echo "xform: wrote ${OUTPUT} ($(wc -c < "${OUTPUT}") bytes)"
        fi
        if [[ -n "$primary" ]]; then
          out_dir="$(dirname "$primary")/output"
          if [[ -d "$out_dir" ]]; then
            echo "xform: outputs under ${out_dir}:"
            find "$out_dir" -type f -printf '  %p (%s bytes)\n' | sort
            if [[ -n "${FINAL}" ]]; then
              for candidate in "$out_dir"/*."${FINAL}" "$out_dir/${FINAL}"; do
                [[ -f "$candidate" ]] || continue
                echo "xform: ${FINAL} preview (${candidate}):"
                sed -n '1,40p' "$candidate"
                break
              done
            fi
          fi
        fi
