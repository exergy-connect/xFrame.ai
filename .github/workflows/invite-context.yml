# Commits an encrypted invite context file submitted by the Cloudflare Worker
# (repository_dispatch event_type: invite-context) and redeploys static assets.
name: Invite context file

on:
  repository_dispatch:
    types: [invite-context]

permissions:
  contents: write

jobs:
  commit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate payload
        id: payload
        env:
          PATH_REL: ${{ github.event.client_payload.path }}
          CONTENT_B64: ${{ github.event.client_payload.contentBase64 }}
          INVITE_ID: ${{ github.event.client_payload.inviteId }}
        run: |
          set -euo pipefail
          if [[ -z "${PATH_REL}" || -z "${CONTENT_B64}" || -z "${INVITE_ID}" ]]; then
            echo "Missing path, contentBase64, or inviteId in client_payload" >&2
            exit 1
          fi
          lower_id=$(echo "${INVITE_ID}" | tr '[:upper:]' '[:lower:]')
          expected="contexts/${lower_id}.ctx"
          if [[ "${PATH_REL}" != "${expected}" ]]; then
            echo "Path ${PATH_REL} does not match inviteId ${INVITE_ID}" >&2
            exit 1
          fi
          if [[ ! "${PATH_REL}" =~ ^contexts/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.ctx$ ]]; then
            echo "Refusing path outside contexts/<uuid>.ctx: ${PATH_REL}" >&2
            exit 1
          fi
          echo "rel_path=${PATH_REL}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.ref || github.event.repository.default_branch }}

      - name: Write context file
        env:
          PATH_REL: ${{ steps.payload.outputs.rel_path }}
          CONTENT_B64: ${{ github.event.client_payload.contentBase64 }}
        run: |
          set -euo pipefail
          dest="docs/examples/resume/${PATH_REL}"
          mkdir -p "$(dirname "$dest")"
          echo "${CONTENT_B64}" | base64 -d > "$dest"
          test -s "$dest"

      - name: Commit and push
        env:
          PATH_REL: ${{ steps.payload.outputs.rel_path }}
          INVITE_ID: ${{ github.event.client_payload.inviteId }}
        run: |
          set -euo pipefail
          git config user.name "xframe-invite-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/examples/resume/${PATH_REL}"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add invite context ${INVITE_ID}"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not configured"
            exit 0
          fi
          npm install --no-save wrangler@4
          npx wrangler deploy
