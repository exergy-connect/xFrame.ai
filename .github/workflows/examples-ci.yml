# Regenerate example consolidated output, then compile the presentation deck.
# Jobs run sequentially so only one commit/push happens at a time.
name: xFrame examples

on:
  push:
    branches:
      - main
    paths:
      - "examples/consolidate/model/**"
      - "examples/consolidate/data/**"
      - "examples/present/**"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xframe-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run xFrame consolidator
        uses: exergy-connect/xFrame.ai@main
        with:
          working-dir: examples/consolidate
          note: "CI consolidate after model/data change (${{ github.sha }})"
          js: "true"

      - name: Publish consolidated JS into public
        run: |
          mkdir -p public
          cp examples/consolidate/output/consolidated_data.js public/consolidated_data.js

      - name: Commit consolidated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            examples/consolidate/output/consolidated.schema.json \
            examples/consolidate/output/consolidated_data.json \
            examples/consolidate/output/consolidated.schema.js \
            public/consolidated_data.js
          if git diff --staged --quiet; then
            echo "No changes to consolidated schema or data."
          else
            git commit -m "examples: refresh consolidated schema and data (CI)"
            git push origin "${GITHUB_REF_NAME}"
          fi

  present:
    needs: consolidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Compile example presentation
        run: |
          node skills/xframe-present/scripts/present.min.js \
            examples/present/example-deck.md \
            --output examples/present/example-deck.html

      - name: Commit compiled HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f examples/present/example-deck.html
          if git diff --staged --quiet; then
            echo "No changes to compiled presentation."
          else
            git commit -m "examples: refresh compiled presentation (CI)"
            git push origin "${GITHUB_REF_NAME}"
          fi
