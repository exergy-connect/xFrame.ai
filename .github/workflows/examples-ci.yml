# Regenerate example consolidated output, compile the presentation deck, then commit once.
name: xFrame examples

on:
  push:
    branches:
      - main
    paths:
      - "examples/consolidate/model/**"
      - "examples/consolidate/data/**"
      - "examples/present/**"
      - "present/action.yml"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xframe-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run xFrame consolidator
        uses: exergy-connect/xFrame.ai@main
        with:
          working-dir: examples/consolidate
          note: "CI consolidate after model/data change (${{ github.sha }})"
          clean: "true"

      - name: Compile example presentation
        uses: exergy-connect/xFrame.ai/present@main
        with:
          input: examples/present/example-deck.md
          output: examples/present/example-deck.html
          data: ${{ github.workspace }}/examples/consolidate/output/consolidated_data.json

      - name: Commit generated examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            examples/consolidate/output/consolidated.schema.json \
            examples/consolidate/output/consolidated_data.json \
            examples/present/example-deck.html
          if git diff --staged --quiet; then
            echo "No changes to generated examples."
          else
            git commit -m "examples: refresh consolidated output and presentation (CI)"
            git push origin "${GITHUB_REF_NAME}"
          fi
