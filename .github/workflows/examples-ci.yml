# Regenerate example consolidated output, compile locale decks (example-deck*.md), then commit once.
name: xFrame examples

on:
  push:
    branches:
      - main
    paths:
      - "examples/consolidate/model/**"
      - "examples/consolidate/data/**"
      - "examples/present/**/*.md"
      - "examples/present/_shared/**"
      - "examples/present/snapshots/**"
      - "examples/present/diagrams/**"
      - "examples/present/*.png"
      - "skills/xframe-present/**"
      - "present/action.yml"
      - "action.yml"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xframe-examples-${{ github.ref }}
  cancel-in-progress: true

env:
  DATA: ${{ github.workspace }}/examples/consolidate/output/consolidated_data.json
  PRESENT_OUT: examples/present/output

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # External repos: uses: exergy-connect/xFrame.ai@main
      - name: Run xFrame consolidator
        uses: ./
        with:
          working-dir: examples/consolidate
          note: "CI consolidate after model/data change (${{ github.sha }})"
          clean: "true"

      - name: Prepare presentation output directory
        run: mkdir -p "$PRESENT_OUT"

      # External repos: uses: exergy-connect/xFrame.ai/present@main
      # Compiling the base deck also compiles locale siblings (example-deck.cz.html, …).
      - name: Compile example presentations
        uses: ./present
        with:
          input: examples/present/example-deck.md
          output: examples/present/output/example-deck.html
          data: ${{ env.DATA }}

      - name: Sync published demos to docs/
        run: |
          set -euo pipefail
          mkdir -p docs/examples/present
          for html in "$PRESENT_OUT"/*.html; do
            base=$(basename "$html")
            [[ "$base" =~ ^example-deck(\.[A-Za-z0-9-]+)?\.html$ ]] || continue
            cp "$html" "docs/examples/present/$base"
          done

      - name: Commit generated examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            examples/consolidate/output/consolidated.schema.json \
            examples/consolidate/output/consolidated_data.json
          shopt -s nullglob
          for html in "$PRESENT_OUT"/*.html; do
            base=$(basename "$html")
            [[ "$base" =~ ^example-deck(\.[A-Za-z0-9-]+)?\.html$ ]] || continue
            git add -f "docs/examples/present/$base"
          done
          if git diff --staged --quiet; then
            echo "No changes to generated examples."
            exit 0
          fi
          git commit -m "examples: refresh consolidated output and presentation (CI) [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin "${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing on latest and retrying"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "Failed to push after multiple attempts" >&2
          exit 1
