# Deploys the combined xframe-ai Worker (résumé assets + Gemini proxy).
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
    paths:
      - "cloudflare-proxy/**"
      - "docs/examples/resume/**"
      - "src/worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare-proxy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are required" >&2
            exit 1
          fi
          npm install --no-save wrangler@4
          npx wrangler deploy
