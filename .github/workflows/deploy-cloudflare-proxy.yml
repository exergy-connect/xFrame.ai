name: Deploy Cloudflare proxy

on:
  push:
    branches: [main]
    paths:
      - "cloudflare-proxy/**"
      - ".github/workflows/deploy-cloudflare-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-proxy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-proxy

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare-proxy/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Test
        run: npm test

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-proxy
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler.jsonc
