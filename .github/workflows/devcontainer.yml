name: Build xFrame.ai image

on:
  push:
    branches: [main]
    paths: &image-paths
      - ".devcontainer/**"
      - ".github/workflows/devcontainer.yml"
      - ".github/scripts/smoke-devcontainer-skills.sh"
      - "docs/install-skills.sh"
      - "docs/examples/conceptlab/**"
  pull_request:
    paths: *image-paths
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          provenance: false
          tags: |
            xframe-ai:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test skills
        run: |
          docker run --rm \
            --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/workspaces/xFrame.ai:ro" \
            -w /workspaces/xFrame.ai \
            -e HOME=/tmp \
            xframe-ai:ci \
            /workspaces/xFrame.ai/.github/scripts/smoke-devcontainer-skills.sh

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      # New GHCR packages default to private; keep this image anonymously pullable.
      - name: Make package public
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${{ github.event.repository.name }}"
          encoded="${pkg//\//%2F}"
          settings="https://github.com/orgs/${{ github.repository_owner }}/packages/container/${encoded}/settings"
          if gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "/orgs/${{ github.repository_owner }}/packages/container/${encoded}" \
            -f visibility=public; then
            echo "Package visibility set to public."
          else
            echo "::warning::Could not set GHCR visibility via API. Make it public once at: ${settings}"
            echo "::warning::Danger Zone → Change visibility → Public (irreversible)."
          fi
